name: gthumb-unofficial
base: core26
version: '4.0'
summary: An image viewer and browser utility for the GNOME environment
description: |
    Thumbnails is an image viewer and browser for the GNOME Desktop. It also includes an importer tool for transferring photos from cameras.
grade: stable
confinement: strict
platforms:
  amd64:
  arm64:
  armhf:

slots:
   dbus-gthumb:
      interface: dbus
      bus: session
      name: org.gnome.gthumb

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gthumb/extensions:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gthumb/extensions
  /usr/share/gthumb:
    symlink: $SNAP/usr/share/gthumb
  /usr/share/help:
    symlink: $SNAP/usr/share/help

apps:
  gthumb:
    command: usr/bin/gthumb
    desktop: usr/share/applications/org.gnome.gthumb.desktop
    plugs: [home, x11, desktop, desktop-legacy, removable-media, network]
    extensions: [gnome]
    slots: [dbus-gthumb]
    environment:
       DISABLE_WAYLAND: 1
       GIO_MODULE_DIR: ""

parts:
  main:
    source: https://download.gnome.org/sources/gthumb/4.0/gthumb-4.0.tar.xz
    plugin: meson
    meson-parameters: [--prefix=/usr]

    override-pull: |
       craftctl default
       # Fix a crash (segfault via g_variant_new_string(NULL) deep inside
       # libcolord) that occurs when Gdk.Monitor.description is NULL,
       # which can happen under sandboxed/non-standard display setups.
       patch -p1 -d "$CRAFT_PART_SRC" < "$CRAFT_PROJECT_DIR/patches/0001-gth-color-manager-fix-null-monitor-name-crash.patch"

    stage-packages:
      - gsettings-desktop-schemas
      # Bundle missing libraries to avoid "cannot open shared object file" errors
      - libgstreamer1.0-dev
      - libexiv2-dev
    build-packages:
      - libraw-dev
      - librsvg2-dev
      - liblcms2-dev
      - libcolord-gtk-dev
      - libjxl-dev
      - meson
      - libexiv2-dev
      - gettext
      - bison
      - flex
      - itstool
      # libjpeg-turbo8-dev (not libjpeg9-dev, which conflicts with it and has
      # a different, ABI-incompatible SONAME): gnome-platform already ships
      # the runtime libjpeg-turbo8 (libjpeg.so.8), so build against the same
      # version instead of bundling a second, colliding libjpeg at runtime.
      - libjpeg-turbo8-dev
